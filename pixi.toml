[workspace]
name = "sv-tutorial"
version = "1.0.0"
description = "Long-read structural variant calling tutorial"
authors = ["Tobias Rausch <rausch@embl.de>"]
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]

[dependencies]
delly = ">=2.6"
wally = ">=0.9.1"
alfred = ">=0.6"
samtools = ">=1.18"
bcftools = ">=1.18"
bedtools = "*"
htslib = "*"
minimap2 = "*"
datamash = "*"
cramino = "*"
r-base = "*"
r-ggplot2 = "*"
r-scales = "*"
r-gridextra = "*"
r-cowplot = "*"
r-reshape2 = "*"
bioconductor-dnacopy = "*"
jupyterlab = "*"
pysam = "*"
numpy = "*"

[pypi-dependencies]
gdown = "*"
igv-notebook = "*"

[feature.dataprep.dependencies]
clair3 = "*"
longphase = "*"

[environments]
dataprep = ["dataprep"]

[tasks]
lab = "jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --allow-root --ServerApp.token=''"
download = { cmd = "mkdir -p data && cd data && gdown $FILE && tar -xzf lr.tar.gz && cp ../scripts/cnBafSV.R ../scripts/igv.ipynb lr/ && rm lr.tar.gz" }

